# One image per language profile: ghcr.io/clunkyard/toolchain/<profile>.
# family names the Dockerfile in families/ whose stage of the same name
# installs the toolchain. version is the one supported version, the hosted
# builder's, and becomes an image tag. platforms defaults to linux/amd64;
# linux/arm64 is added, best effort, where the CLI releases an SDK for it.
profiles:
  vane:                {family: node, version: node-24.22.3, platforms: "linux/amd64,linux/arm64"}
  cadence:             {family: node, version: node-24.22.3, platforms: "linux/amd64,linux/arm64"}
  glyph:               {family: node, version: node-24.22.3, platforms: "linux/amd64,linux/arm64"}
